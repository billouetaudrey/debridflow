<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #30363d;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #58a6ff;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 12px;
      background: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
    }
    .status-badge.online {
      background: rgba(46, 160, 67, 0.15);
      border-color: #2ea043;
      color: #3fb950;
    }
    .status-badge.offline {
      background: rgba(248, 81, 73, 0.15);
      border-color: #f85149;
      color: #ff7b72;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #8b949e;
      font-size: 12px;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 13px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #58a6ff;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .btn-save {
      background: #238636;
      border-color: #2ea043;
      color: #ffffff;
    }
    .btn-save:hover { background: #2ea043; }
    .btn-test {
      background: #21262d;
      border-color: #30363d;
      color: #c9d1d9;
    }
    .btn-test:hover { background: #30363d; color: #ffffff; }
    .btn-web {
      width: 100%;
      margin-top: 8px;
      background: transparent;
      border-color: #30363d;
      color: #58a6ff;
    }
    .btn-web:hover { background: #161b22; }
    #msg {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>⚡</span>
      <span>OmniSym</span>
    </div>
    <span id="server-status" class="status-badge">Test en cours...</span>
  </div>

  <div class="form-group">
    <label for="serverUrl">URL du serveur OmniSym</label>
    <input type="text" id="serverUrl" placeholder="http://192.168.1.XX:6505">
  </div>

  <div class="form-group">
    <label for="category">Catégorie par défaut</label>
    <input type="text" id="category" placeholder="torrent-direct">
  </div>

  <div class="form-group">
    <label for="transferMode">Mode de transfert par défaut</label>
    <select id="transferMode">
      <option value="download">💾 Téléchargement réel (Local)</option>
      <option value="symlink">🔗 Symlink (Instantané)</option>
    </select>
  </div>

  <div class="btn-row">
    <button type="button" id="btn-test" class="btn-test">Tester</button>
    <button type="button" id="btn-save" class="btn-save">Enregistrer</button>
  </div>

  <button type="button" id="btn-open-web" class="btn-web">🚀 Ouvrir OmniSym Web</button>
  <div id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
